
# ##########################################################
# Package

[package]

authors = [
	"Matt Wilson <matthew@synesis.com.au>",
]
categories = [
	"development-tools::testing",
]
description = "Test helpers for Rust"
documentation = "https://docs.rs/test_help-rs"
edition = "2021"
homepage = "https://github.com/synesissoftware/test_help-rs"
keywords = [
	"approximate",
	"assertions",
	"f64",
	"float",
	"testing",
]
license = "BSD-3-Clause"
name = "test_help-rs"
readme = "README.md"
repository = "https://github.com/synesissoftware/test_help-rs"
rust-version = "1.74"
version = "0.1.2"


# ##########################################################
# Targets

[lib]
name = "test_helpers"
path = "src/lib.rs"

[[example]]
name = "scalars"
path = "examples/scalars.rs"

[[example]]
name = "vectors"
path = "examples/vectors.rs"


# ##########################################################
# Features

[features]

default = [
]

# General features:
#
# - "null-feature" - a feature that has no effect (and, thus, is useful for simplifying driver scripts);

null-feature = []


# Crate-specific features:
#
# - "nan-equality" - allows two `f64::NAN` values to be evaluated to be equal for the purposes of passing the assertions. NOTE: this affects all stock comparisons of the crate, but does not affect custom implementations of `ApproximateEqualityEvaluator`;
# - "nightly-constants" - enables unit tests for additional `std::f64` constants that require the unstable `more_float_constants` feature; requires a nightly toolchain — use `./scripts/test-nightly-constants` (or ensure rustup's `~/.cargo/bin` precedes Homebrew on `PATH`, then `cargo +nightly test --features nightly-constants`);

nan-equality = []
nightly-constants = []


# ##########################################################
# Dependencies

[build-dependencies]

bt-rs = { version = "0.0", default-features = false, features = [
] }

[dependencies]

base-traits = { version = "0", default-features = false, features = [
    "implement-ToF64-for-built_ins",
] }


[dev-dependencies]

# criterion = { version = "0.8", default-features = false, features = [
# 	"plotters",
# ] }


