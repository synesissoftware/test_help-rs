name: CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test, Clippy, Docs, Examples, Fmt, Checkers, Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (all targets)
        run: cargo test --all-targets --locked

      - name: cargo test (nan-equality)
        run: cargo test --features nan-equality --locked

      - name: cargo test (no default features)
        run: cargo test --no-default-features --locked

      - name: cargo clippy (non-nightly features)
        run: cargo clippy --all-targets --no-default-features --features nan-equality --locked -- -D warnings

      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: cargo build (examples)
        run: cargo build --examples --locked

      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-08-08 --profile minimal --component rustfmt

      - name: rustfmt
        run: ./scripts/fmt --check

      - name: DOC_76 checker
        run: python3 scripts/check_doc_76.py

      - name: RUST_TEST_NAMING checker
        run: python3 scripts/check_test_names.py

      - name: DERIVE_LAYOUT checker
        run: python3 scripts/check_derives.py

      - name: cargo publish (dry run)
        run: cargo publish --dry-run --locked

  msrv:
    name: MSRV (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.74.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (library)
        run: cargo check --lib --locked

  nightly-constants:
    name: Nightly constants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (nightly-constants)
        run: cargo +nightly-2026-08-08 test --features nightly-constants --locked

      - name: cargo test (full)
        run: cargo +nightly-2026-08-08 test --features full --locked
